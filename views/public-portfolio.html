<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Portfolio</title>
  
  <!-- SEO & Social Meta Tags -->
  <meta name="description" content="Personal Portfolio Website showcasing projects, skills, education, and experience.">
  <meta property="og:title" content="Personal Portfolio">
  <meta property="og:description" content="Personal Portfolio Website showcasing projects, skills, education, and experience.">
  <meta property="og:type" content="website">

  <!-- Typography: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/portfolio-site.css">
  <link rel="stylesheet" href="/css/ats-resume.css">
  <link rel="stylesheet" href="/css/templates.css">

  <!-- html2pdf for direct ATS resume PDF downloading on public site -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8FAFC;
      color: #0F172A;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .public-site-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      text-align: center;
      padding: 2rem;
    }

    .public-site-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #E2E8F0;
      border-top-color: #2563EB;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .public-site-404 {
      max-width: 520px;
      margin: 5rem auto;
      text-align: center;
      padding: 3rem 2rem;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
  </style>
</head>
<body>

  <!-- Loading State Container -->
  <div id="loadingContainer" class="public-site-loading">
    <div class="public-site-spinner"></div>
    <h3 style="font-weight: 700; color: #0F172A; margin-bottom: 0.25rem;">Loading Personal Portfolio...</h3>
    <p style="color: #64748B; font-size: 0.95rem; margin: 0;">Retrieving published creator profile and verified portfolio assets...</p>
  </div>

  <!-- Main Live Portfolio Mount Point -->
  <div id="portfolioMountPoint" style="display: none;"></div>

  <!-- 404 Fallback Container -->
  <div id="notFoundContainer" class="public-site-404" style="display: none;">
    <div style="font-size: 3rem; margin-bottom: 1rem;">🔍</div>
    <h2 style="font-weight: 800; color: #0F172A; margin-bottom: 0.5rem;">Portfolio Not Found</h2>
    <p style="color: #64748B; font-size: 0.95rem; margin-bottom: 2rem;">
      The requested personal portfolio does not exist, was removed, or the link may be mistyped.
    </p>
    <a href="/create" class="btn-site-primary">
      <span>Create Your Free Portfolio</span>
    </a>
  </div>

  <!-- Core Scripts -->
  <script src="/js/templates.js"></script>
  <script src="/js/generator.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const loading = document.getElementById('loadingContainer');
      const mount = document.getElementById('portfolioMountPoint');
      const notFound = document.getElementById('notFoundContainer');

      // Extract portfolio ID from URL path: /portfolio/:id
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const portfolioId = pathParts[pathParts.length - 1];

      if (!portfolioId || portfolioId === 'portfolio') {
        loading.style.display = 'none';
        notFound.style.display = 'block';
        return;
      }

      try {
        const resp = await fetch(`/api/portfolios/${encodeURIComponent(portfolioId)}`);
        if (!resp.ok) {
          throw new Error('Portfolio not found');
        }

        const resData = await resp.json();
        if (!resData.success || !resData.portfolio || !resData.portfolio.data) {
          throw new Error('Invalid portfolio response');
        }

        const data = resData.portfolio.data;
        const name = (data.personal && data.personal.fullName) || resData.portfolio.name || 'Creator';
        const title = (data.personal && data.personal.title) || '';

        // Update Document Title and Meta
        document.title = `${name}${title ? ' — ' + title : ' — Personal Portfolio'}`;

        // Render the complete Personal Portfolio Website
        mount.innerHTML = PortfolioGenerator.renderPortfolioWebsite(data);
        loading.style.display = 'none';
        mount.style.display = 'block';

        // Attach Resume PDF download handlers
        const resumeBtns = mount.querySelectorAll('.btn-download-resume-trigger');
        resumeBtns.forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.preventDefault();
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span>Generating ATS Resume...</span>';
            btn.style.pointerEvents = 'none';
            try {
              await PortfolioGenerator.downloadAtsResumePdf(null, data);
            } catch (err) {
              console.error('Error downloading resume:', err);
            } finally {
              btn.innerHTML = originalText;
              btn.style.pointerEvents = 'auto';
            }
          });
        });

      } catch (err) {
        console.warn('Portfolio load error:', err);
        loading.style.display = 'none';
        notFound.style.display = 'block';
      }
    });
  </script>
</body>
</html>
